<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字チャレンジ</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Yu Gothic", "YuGothic", "Meiryo", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #wrap { position: fixed; inset: 0; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; background: #fff; transform-origin: center center; overflow: hidden; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: block; }
  .full { width: 100%; height: 100%; display: block; }

  #lvl { position: absolute; left: 55px; top: 78px; height: 100px; display: flex; align-items: center;
         font-size: 58px; font-weight: 700; color: #111; letter-spacing: 6px; }
  #sentence { position: absolute; left: 55px; width: 1490px; top: 230px; height: 280px;
              display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
              font-size: 67px; color: #222; letter-spacing: 4px; line-height: 1.5; }
  #sentence ruby rt, #ex-sentence ruby rt { font-size: .42em; color: #666; letter-spacing: 0; font-weight: 400; }
  #sentence .ans { color: #d32f2f; font-weight: 700; display: inline-block; animation: pop .55s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1); } }
  #note { animation: fadeup .5s .25s both; }
  @keyframes fadeup { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  #s-game, #s-method { cursor: pointer; }
  #sentence .msg { color: #777; font-size: 54px; }
  #ttl { position: absolute; left: 55px; width: 1490px; top: 149px; height: 246px; display: flex;
         align-items: center; justify-content: center; font-size: 110px; font-weight: 700; color: #595959; letter-spacing: 4px; }
  #note { margin-top: 26px; font-size: 40px; color: #666; letter-spacing: 2px; white-space: nowrap; }
  #note .x { color: #999; text-decoration: line-through; }
  #note .o { color: #d32f2f; font-weight: 700; }
  #ttl { top: 60px !important; }
  #cards { position: absolute; left: 600px; top: 330px; width: 950px; display: flex; gap: 40px; }
  .card { flex: 1; height: 360px; border: 5px solid #e0e0e0; border-radius: 28px; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 22px; cursor: pointer; transition: .15s; background: #fff; }
  .card.focus { border-color: #f0b400; transform: translateY(-6px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }
  .card:hover { border-color: #f0b400; transform: translateY(-6px); box-shadow: 0 10px 24px rgba(0,0,0,.08); }
  .cl { width: 84px; height: 84px; border-radius: 50%; background: #f0b400; color: #fff; font-size: 52px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; }
  .cn { font-size: 54px; font-weight: 700; color: #333; }
  .ce { font-size: 40px; color: #666; }
  .ce b { color: #d32f2f; }
  #mode { position: absolute; right: 50px; top: 40px; font-size: 28px; color: #bbb; letter-spacing: 2px; }
  #m-ttl { position: absolute; left: 55px; top: 78px; height: 100px; display: flex; align-items: center; font-size: 58px; font-weight: 700; color: #111; }
  #m-sub { position: absolute; left: 260px; top: 78px; height: 100px; display: flex; align-items: center; font-size: 38px; color: #555; }
  #m-sub b { color: #f0b400; margin-right: 14px; }
  #ex-badge { position: absolute; left: 55px; top: 90px; width: 90px; height: 90px; border-radius: 50%; background: #f0b400; color: #fff;
              font-size: 52px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  #ex-sub { position: absolute; left: 170px; top: 85px; height: 100px; display: flex; align-items: center; font-size: 38px; color: #555; }
  #ex-sentence { position: absolute; left: 55px; width: 1490px; top: 230px; height: 200px; display: flex; align-items: center; justify-content: center;
                 font-size: 67px; color: #222; letter-spacing: 4px; white-space: nowrap; }
  #ex-sentence .ans { color: #d32f2f; font-weight: 700; display: inline-block; animation: pop .55s cubic-bezier(.2,1.6,.4,1); }
  #ex-note { position: absolute; left: 600px; right: 60px; top: 460px; text-align: center; font-size: 40px; color: #666; }
  #ex-note .hint { display: inline-block; border: 3px dashed #f0b400; border-radius: 16px; padding: 14px 30px; }
  #ex-note .x { color: #999; text-decoration: line-through; }
  #ex-note .o { color: #d32f2f; font-weight: 700; }
  #s-example { cursor: pointer; }
  .go { position: absolute; left: 0; right: 0; bottom: 60px; text-align: center; font-size: 34px; color: #f0b400; font-weight: 700;
          animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  #steps { position: absolute; left: 60px; right: 60px; top: 190px; height: 520px; display: flex; align-items: center; justify-content: center; gap: 20px; }
  .step { width: 400px; display: flex; flex-direction: column; align-items: center; }
  .step .pic { height: 300px; width: 340px; display: flex; align-items: flex-end; justify-content: center; }
  .step .pic img, .step .pic svg { max-width: 100%; max-height: 100%; }
  .step .num { margin-top: 24px; width: 64px; height: 64px; border-radius: 50%; background: #f0b400; color: #fff; font-size: 38px; font-weight: 700;
               display: flex; align-items: center; justify-content: center; }
  .step .txt { margin-top: 16px; font-size: 44px; line-height: 1.4; text-align: center; color: #222; font-weight: 700; }
  .arrow { font-size: 48px; color: #ddd; margin-bottom: 120px; }
  #kids { position: absolute; left: 41px; top: 471px; width: 545px; height: 390px; }
  .footer { position: absolute; right: 50px; bottom: 52px; font-size: 33px; font-weight: 400; color: #000; letter-spacing: 1px;
            font-family: Arial, "Yu Gothic", "YuGothic", "Meiryo", "Hiragino Sans", sans-serif; }
  #count { position: absolute; right: 50px; top: 95px; font-size: 30px; color: #999; }

  /* control bar: appears when the mouse moves */
  #list { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; display: none; }
  #list.on { display: flex; align-items: center; justify-content: center; }
  #list-in { width: min(1100px, 94vw); height: 90vh; background: #fff; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
  #list-head { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid #eee; }
  #list-head button { font: inherit; font-size: 15px; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; background: #eee; }
  #list-head .tabs button.sel { background: #f0b400; font-weight: 700; }
  #list-sum { flex: 1; color: #888; font-size: 14px; }
  #list-body { overflow-y: auto; padding: 8px 20px 24px; }
  #list-body h3 { margin: 22px 0 8px; font-size: 20px; }
  #list-body table { width: 100%; border-collapse: collapse; font-size: 17px; }
  #list-body td { padding: 7px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
  #list-body td.n { width: 36px; color: #aaa; text-align: right; }
  #list-body td.a { width: 170px; color: #d32f2f; font-weight: 700; }
  #list-body td.s { width: 40px; text-align: center; }
  #list-body tr.used td { color: #bbb; }
  #list-body tr.used td.a { color: #e8a0a0; }
  #bar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
         display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-radius: 14px;
         background: rgba(30,30,30,.88); color: #fff; font-size: 15px; z-index: 10;
         transition: opacity .3s; opacity: 1; }
  #bar.hide { opacity: 0; pointer-events: none; }
  #bar button { font: inherit; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap;
                background: #444; color: #fff; }
  #bar button:hover { background: #666; }
  #bar button.sel { background: #f0b400; color: #000; font-weight: 700; }
  #bar button.main { background: #2e7d32; }
  #bar button.ansb { background: #c62828; }
  #bar .sep { width: 1px; height: 26px; background: #777; margin: 0 4px; }
</style>
</head>

/* 每回出幾題 */
const ROUND = 10;
/* ============================================ */

const $ = s => document.querySelector(s);
let mode = "read";
let QUESTIONS = READ_Q;
const usedBy = { read: new Set(), wrong: new Set() };
const MODE_NAME = { read: "Ａ 読み方 → 漢字", wrong: "Ｂ まちがい漢字" };
let level = "ALL";
let used = usedBy.read;    // 已出過的題目編號
let current = null;        // 目前題目編號
let showing = "q";         // "q" = 題目, "a" = 答案
let history = [];
let roundNum = 0;      // 這一回已出幾題
let finished = false;  // 是否顯示「終了」畫面
let roundDrawn = [];   // 這一輪抽過的題目（中途離開時會放回去）

function show(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("#s-" + name).classList.add("on");
}

function pool() {
  return QUESTIONS.map((q, i) => i).filter(i => (level === "ALL" || QUESTIONS[i][0] === level) && !used.has(i));
}

function updateCount() {
  $("#count").textContent = roundNum ? `第 ${roundNum} 問 / ${ROUND}` : "";
}

function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function render() {
  show("game");
  $("#mode").textContent = MODE_NAME[mode];
  updateCount();
  const box = $("#sentence");
  if (current === null) {
    $("#lvl").textContent = level === "ALL" ? "" : level;
    box.innerHTML = finished
      ? `<span><span class="ans">${ROUND}問 終了！</span><br><span class="msg" style="font-size:40px">おつかれさまでした！クリックでメニューへ</span></span>`
      : pool().length
      ? '<span class="msg">クリックしてスタート！</span>'
      : '<span class="msg">このレベルの問題は全部出ました！</span>';
    fit();
    return;
  }
  const q = QUESTIONS[current];
  const lv = q[0], pre = q[1], post = q[4];
  $("#lvl").textContent = lv;
  let mid, note = "";
  if (mode === "read") {
    const [kanji, kana] = [q[2], q[3]];
    mid = showing === "a" ? `<span class="ans">【${esc(kanji)}】</span>` : `【${esc(kana)}】`;
  } else {
    const [wrong, right, kind] = [q[2], q[3], q[5]];
    mid = showing === "a" ? `<span class="ans">【${esc(right)}】</span>` : `【${esc(wrong)}】`;
    if (showing === "a") note = `<div id="note"><span class="x">${esc(wrong)}</span> → <span class="o">${esc(right)}</span></div>`;
  }
  box.innerHTML = `<span>${rb(pre)}${mid}${rb(post)}</span>` + note;
  fit();
}

/* 文字太長時自動縮小 */
function fit() {
  const box = $("#sentence");
  let size = 67;
  box.style.fontSize = size + "px";
  box.style.whiteSpace = "nowrap";
  const inner = box.firstElementChild;
  while (inner && inner.scrollWidth > 1490 && size > 46) { size -= 1; box.style.fontSize = size + "px"; }
  if (inner && inner.scrollWidth > 1490) box.style.whiteSpace = "normal";
}

function next() {
  // 題目顯示中 → 先顯示答案；答案顯示中 → 下一題
  if (current !== null && showing === "q") { showing = "a"; render(); return; }
  if (finished) { goMenu(); return; }
  else if (roundNum >= ROUND) {
    history.push(current); current = null; finished = true; roundDrawn = []; render(); return;
  }
  const p = pool();
  if (!p.length) { current = null; render(); return; }
  const i = p[Math.floor(Math.random() * p.length)];
  if (current !== null) history.push(current);
  used.add(i); roundDrawn.push(i); current = i; showing = "q"; roundNum++;
  render();
}
function toggleAnswer() { if (current === null) return; showing = showing === "q" ? "a" : "q"; render(); }
function back() {
  if (finished) { finished = false; current = history.pop(); showing = "a"; render(); return; }
  if (current === null) return;
  if (showing === "a") { showing = "q"; render(); return; }
  if (!history.length) return;
  used.delete(current); roundDrawn.pop(); roundNum--; current = history.pop(); showing = "a"; render();
}
let listMode = "read";
function openList(m) {
  listMode = m || listMode;
  document.querySelectorAll("[data-lm]").forEach(b => b.classList.toggle("sel", b.dataset.lm === listMode));
  const data = listMode === "read" ? READ_Q : WRONG_Q, u = usedBy[listMode];
  let html = "";
  for (const lv of ["軽", "中", "高"]) {
    const rows = data.map((q, i) => [q, i]).filter(([q]) => q[0] === lv);
    html += `<h3>${lv}（${rows.length}題）</h3><table>`;
    rows.forEach(([q, i], k) => {
      const shown = listMode === "read" ? q[3] : q[2];   // 題目上顯示的字
      const ans = listMode === "read" ? q[2] : q[3];     // 答案
      html += `<tr class="${u.has(i) ? "used" : ""}"><td class="n">${k + 1}</td>`
        + `<td>${esc(q[1])}【${esc(shown)}】${esc(q[4])}</td><td class="a">${esc(ans)}</td>`
        + `<td class="s">${u.has(i) ? "✓" : ""}</td></tr>`;
    });
    html += "</table>";
  }
  $("#list-body").innerHTML = html;
  $("#list-sum").textContent = `全 ${data.length} 題 ・ 出題済み ${u.size} 題（灰色）`;
  $("#list").classList.add("on");
}
function closeList() { $("#list").classList.remove("on"); }

/* 回到メニュー：這一輪還沒結束的話，把抽過的題目放回去（當作沒出過） */
function goMenu() {
  roundDrawn.forEach(i => used.delete(i));
  roundDrawn = []; current = null; showing = "q"; history = []; roundNum = 0; finished = false;
  show("title");
}
function setMode(m) {
  mode = m; QUESTIONS = m === "read" ? READ_Q : WRONG_Q; used = usedBy[m];
  current = null; showing = "q"; history = []; roundNum = 0; finished = false; roundDrawn = [];
  document.querySelectorAll("[data-m]").forEach(b => b.classList.toggle("sel", b.dataset.m === m));
  render();
}
function setLevel(lv) {
  level = lv; if (current !== null) history.push(current); current = null; showing = "q"; finished = false;
  document.querySelectorAll("[data-lv]").forEach(b => b.classList.toggle("sel", b.dataset.lv === lv));
  render();
}
function reset() {
  used.clear(); current = null; history = []; roundNum = 0; finished = false; roundDrawn = []; render();
}
function confirmReset() {
  const b = $("#b-reset");
  if (b.dataset.armed) { delete b.dataset.armed; b.textContent = "リセット"; return true; }
  b.dataset.armed = "1"; b.textContent = "もう一度押す";
  setTimeout(() => { delete b.dataset.armed; b.textContent = "リセット"; }, 2500);
  return false;
}
function fullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  else document.exitFullscreen();
}

/* 按鈕 */
document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => b.dataset.go === "method" ? showMethod() : goMenu());
document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => setLevel(b.dataset.lv));
document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => setMode(b.dataset.m));
/* ===== 範例題（不會出現在正式題目裡） ===== */
const EXAMPLE = {
  read:  { pre: "毎朝、", q: "こうえん", a: "公園", post: "を散歩します。",
           hint: "ひらがなを見て、<b>漢字</b>でボードに書こう！" },
  wrong: { pre: "", q: "飞行機", a: "飛行機", post: "で東京へ行きました。",
           hint: "<b>まちがいの字</b>を見つけて、正しく書こう！" },
};
let exStep = 0;
function showExample() { exStep = 0; renderExample(); show("example"); }
function renderExample() {
  const e = EXAMPLE[mode];
  $("#ex-sub").innerHTML = MODE_DESC[mode];
  if (exStep === 0) {
    $("#ex-sentence").innerHTML = `${rb(e.pre)}【${e.q}】${rb(e.post)}`;
    $("#ex-note").innerHTML = `<span class="hint">${e.hint}</span>`;
    $("#ex-go").textContent = "クリックで答えを見る ▶";
  } else {
    $("#ex-sentence").innerHTML = `${rb(e.pre)}<span class="ans">【${e.a}】</span>${rb(e.post)}`;
    $("#ex-note").innerHTML = (mode === "read" ? `${e.q}` : `<span class="x">${e.q}</span>`)
      + ` → <span class="o">${e.a}</span>　正解！🍫`;
    $("#ex-go").textContent = "クリックしてスタート ▶";
  }
}

const MODE_DESC = { read: "<b>Ａ</b>読み方を見て、漢字を書こう！", wrong: "<b>Ｂ</b>まちがいを見つけて、正しい漢字を書こう！" };
const MODES = ["read", "wrong"];
let cardIdx = 0;
function focusCard(i) {
  cardIdx = i;
  document.querySelectorAll(".card").forEach((c, j) => c.classList.toggle("focus", j === i));
}
focusCard(0);
function showMethod() {
  focusCard(MODES.indexOf(mode)); $("#m-sub").innerHTML = MODE_DESC[mode]; show("method"); }
document.querySelectorAll(".card").forEach(c => c.onclick = () => { setMode(c.dataset.mode); showMethod(); });
/* 點畫面任何地方：出題 → 公布答案 → 下一題 */
$("#s-game").addEventListener("click", next);
$("#s-method").addEventListener("click", showExample);
function exampleNext() {
  if (exStep === 0) { exStep = 1; renderExample(); }
  else if (current === null && !finished) next(); else render();
}
$("#s-example").addEventListener("click", exampleNext);
/* 依目前畫面決定「下一步」 */
function advance() {
  if ($("#s-method").classList.contains("on")) showExample();
  else if ($("#s-example").classList.contains("on")) exampleNext();
  else next();
}
$("#b-reset").onclick = reset;
$("#b-list").onclick = () => openList(mode);
$("#b-furi").onclick = toggleFuri;
$("#list-close").onclick = closeList;
$("#list").onclick = e => { if (e.target.id === "list") closeList(); };
document.querySelectorAll("[data-lm]").forEach(b => b.onclick = () => openList(b.dataset.lm));
$("#b-fs").onclick = fullscreen;

/* 鍵盤 */
document.addEventListener("keydown", e => {
  const k = e.key;
  if ($("#list").classList.contains("on")) { if (k === "Escape" || k === "l" || k === "L") closeList(); return; }
  if (k === "l" || k === "L") { openList(mode); return; }
  if ($("#s-title").classList.contains("on")) {      // メニュー：← → で選ぶ、Enter で決定
    if (k === "ArrowLeft" || k === "ArrowRight") { e.preventDefault(); focusCard(k === "ArrowLeft" ? 0 : 1); return; }
    if (k === "Enter") { e.preventDefault(); const m = MODES[cardIdx]; setMode(m); showMethod(); return; }
    if (k === " " || k === "PageDown" || k === "PageUp" || k === "Backspace") { e.preventDefault(); return; }
  }
  if (k === " " || k === "Enter" || k === "ArrowRight" || k === "PageDown") { e.preventDefault(); advance(); }
  else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); back(); }
  else if (k === "a" || k === "A") toggleAnswer();
  else if (k === "f" || k === "F") fullscreen();
  else if (k === "r" || k === "R") toggleFuri();
  else if (k === "t" || k === "T" || k === "Escape") goMenu();
  else if (k === "z" || k === "Z") { setMode("read"); showMethod(); }
  else if (k === "x" || k === "X") { setMode("wrong"); showMethod(); }
  else if (k === "m" || k === "M") showMethod();
  else if (k === "0") setLevel("ALL");
  else if (k === "1") setLevel("軽");
  else if (k === "2") setLevel("中");
  else if (k === "3") setLevel("高");
  else if (k === "h" || k === "H") $("#bar").classList.toggle("hide");
});

/* 滑鼠移到畫面最下方時才顯示控制列 */
const BAR_ZONE = 120;   // 距離畫面底部多少 px 以內會顯示
function onMove(e) {
  $("#bar").classList.toggle("hide", e.clientY < innerHeight - BAR_ZONE);
}
document.addEventListener("mousemove", onMove);
document.addEventListener("mouseleave", () => $("#bar").classList.add("hide"));
$("#bar").classList.add("hide");

/* 依螢幕大小縮放 16:9 畫面 */
let scale = 1;
function resize() {
  scale = Math.min(innerWidth / 1600, innerHeight / 900);
  $("#stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
}
addEventListener("resize", resize);
resize();
document.querySelectorAll(".footer").forEach(f => f.textContent = FOOTER);
setLevel("ALL");
setMode("read");
show("title");
</script>
</body>
</html>
